<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Film | CineFlix</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --bg-2: #121219;
        --panel: rgba(20,20,27,0.9);
        --white: #f5f5f5;
        --muted: #b7b7bf;
        --line: rgba(255,255,255,0.08);
        --red: #e50914;
        --red-2: #b20710;
        --good: #46d369;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
      }

      a { color: inherit; text-decoration: none; }
      img { display: block; max-width: 100%; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(11,11,15,0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .container {
        width: min(1200px, calc(100% - 40px));
        margin: 0 auto;
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
      }

      .brand {
        color: var(--red);
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .nav {
        display: flex;
        gap: 22px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .nav a:hover { color: var(--white); }

      .hero {
        position: relative;
        min-height: 540px;
        display: flex;
        align-items: end;
        background-size: cover;
        background-position: center;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(0,0,0,0.82), rgba(0,0,0,0.25), rgba(0,0,0,0.78));
      }

      .hero-content {
        position: relative;
        z-index: 1;
        padding: 72px 0 60px;
        width: min(900px, 100%);
      }

      .movie-tag {
        display: inline-block;
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--line);
        color: var(--muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-size: 0.7rem;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.8rem, 5vw, 5rem);
        line-height: 0.9;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        color: var(--muted);
        margin-bottom: 18px;
      }

      .score {
        color: var(--good);
        font-weight: 700;
      }

      .description {
        max-width: 640px;
        color: rgba(255,255,255,0.85);
        line-height: 1.7;
        font-size: 1.04rem;
        margin-bottom: 24px;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border-radius: 8px;
        font-weight: 700;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--red);
        color: white;
      }

      .btn-primary:hover { background: var(--red-2); }

      .btn-secondary {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.16);
        color: white;
      }

      .content {
        padding: 30px 0 64px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: 1.5fr 0.9fr;
        gap: 30px;
      }

      .panel {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      .detail-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      .detail-list li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }

      .detail-list span:last-child {
        color: var(--white);
        text-align: right;
      }

      .recommendations {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 16px;
        margin-top: 26px;
      }

      .mini-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .mini-card:hover {
        transform: translateY(-4px);
        border-color: rgba(229, 9, 20, 0.5);
      }

      .mini-card img {
        width: 100%;
        height: 170px;
        object-fit: cover;
      }

      .mini-card .text {
        padding: 12px;
        font-weight: 700;
      }

      .cast-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 14px;
        margin-top: 22px;
      }

      .cast-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        text-align: center;
      }

      .cast-card .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        margin: 0 auto 10px;
        display: grid;
        place-items: center;
        font-weight: 800;
        background: linear-gradient(135deg, rgba(229,9,20,0.8), rgba(255,255,255,0.12));
        color: var(--white);
      }

      .cast-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .cast-card span {
        color: var(--muted);
        font-size: 0.82rem;
      }

      @media (max-width: 860px) {
        .nav { display: none; }
        .info-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="index.html" class="brand">NETFLIX</a>
        <nav class="nav" aria-label="Navigasi utama">
          <a href="index.html">Beranda</a>
          <a href="series.html">Series</a>
          <a href="movies.html">Film</a>
          <a href="watchlist.html">Watchlist</a>
          <a href="search.html">Search</a>
          <a href="profile.html">Profil</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <div class="container hero-content">
          <div class="movie-tag" id="movieTag">Drama</div>
          <h1 id="movieTitle">Crimson Horizon</h1>
          <div class="meta">
            <span class="score" id="movieScore">9.7</span>
            <span id="movieYear">2026</span>
            <span id="movieGenre">Drama • Sci‑Fi</span>
            <span id="movieDuration">2h 14m</span>
          </div>
          <p class="description" id="movieDescription"></p>
          <div class="cta">
            <button class="btn btn-primary" id="playTrailerBtn">▶ Putar</button>
            <button class="btn btn-secondary watchlist-toggle" type="button" data-title="Crimson Horizon">＋ Daftar Saya</button>
          </div>
        </div>
      </section>

      <div class="container content">
        <div class="info-grid">
          <section class="panel">
            <h2>Sinopsis</h2>
            <p id="synopsis" style="color: var(--muted); line-height: 1.7;"></p>

            <div style="margin-top: 24px;">
              <h2 style="margin-bottom: 12px;">Pemain</h2>
              <div class="cast-grid" id="castGrid"></div>
            </div>
          </section>

          <aside class="panel">
            <h2>Detail</h2>
            <ul class="detail-list">
              <li><span>Director</span><span id="detailDirector">Takashi Miike</span></li>
              <li><span>Country</span><span id="detailCountry">Japan</span></li>
              <li><span>Language</span><span id="detailLanguage">Japanese</span></li>
              <li><span>Release</span><span id="detailRelease">2007</span></li>
              <li><span>Genre</span><span id="detailGenre">Drama</span></li>
              <li><span>Durasi</span><span id="detailDuration">2h 14m</span></li>
              <li><span>Tahun</span><span id="detailYear">2026</span></li>
              <li><span>Rating</span><span id="detailRating">18+</span></li>
            </ul>
          </aside>
        </div>

        <section class="panel" style="margin-top: 28px;">
          <h2>Anda mungkin juga suka</h2>
          <div class="recommendations" id="recommendations"></div>
        </section>
      </div>
    </main>

    <script>
      const movies = {
        'crimson-horizon': {
          title: 'Crimson Horizon',
          tag: 'Original',
          score: '9.7',
          year: '2026',
          genre: 'Drama • Sci‑Fi',
          duration: '2h 14m',
          image: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1600&q=80',
          description: 'Ketika dunia kehilangan cahaya yang tersisa, seorang pilot berbakat harus memilih antara membela planetnya atau mengejar masa depan yang tak bisa dijamin.',
          synopsis: 'Bumi mulai kehilangan cahaya, sumber kehidupan, dan ketahanan planet ini tergantung pada keputusan heroik satu pilot yang ditutupi masa lalu. Dalam perjalanan yang brutal dan penuh harapan, ia bertemu dengan sekutu yang tak pernah ia bayangkan. Film ini memadukan drama emosional, misi menegangkan, dan visual luar angkasa yang memukau.',
          rating: '18+',
          director: 'Ari Wibowo',
          country: 'Indonesia',
          language: 'Bahasa Indonesia',
          release: '2026',
          cast: [
            { name: 'Nadya S.', role: 'Pilot' },
            { name: 'Raka H.', role: 'Astronot' },
            { name: 'Mira T.', role: 'Insinyur' },
            { name: 'Irfan D.', role: 'Menteri' }
          ]
        },
        'midnight-run': {
          title: 'Midnight Run',
          tag: 'Action',
          score: '8.9',
          year: '2026',
          genre: 'Action • Thriller',
          duration: '1h 52m',
          image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80',
          description: 'Seorang detektif kota yang merasa hidupnya sudah berakhir harus menjalani pelarian menegangkan melawan pihak yang ingin menutup mulutnya.',
          synopsis: 'Saat sebuah lari pagi tiba-tiba berubah menjadi pelarian hidup-mati, detektif utama harus mengandalkan kecerdasan, keberanian, dan ikatan lama untuk mengungkap konspirasi terbesar di kota itu. Atmosfer gelap dan intensitas tinggi membuat setiap menit terasa seperti bom waktu.',
          rating: '15+',
          director: 'Dimas Raharja',
          country: 'Indonesia',
          language: 'Bahasa Indonesia',
          release: '2026',
          cast: [
            { name: 'Rian F.', role: 'Detektif' },
            { name: 'Salsa M.', role: 'Reporter' },
            { name: 'Dion P.', role: 'Kejaksaan' },
            { name: 'Ziva K.', role: 'CEO' }
          ]
        },
        'iron-breaker': {
          title: 'Iron Breaker',
          tag: 'Sci‑Fi',
          score: '8.7',
          year: '2025',
          genre: 'Sci‑Fi • Adventure',
          duration: '2h 06m',
          image: 'https://images.unsplash.com/photo-1524989941526-4a35bbd4b2c8?auto=format&fit=crop&w=1200&q=80',
          description: 'Dalam dunia yang penuh mesin raksasa, seorang mekanik muda menemukan kunci untuk membalikkan kehancuran yang menimpa seluruh kota.',
          synopsis: 'Iron Breaker mengikuti perjalanan seorang mekanik muda yang tak pernah ingin masuk ke pusat kekuasaan. Ketika kota runtuh dan mesin raksasa mulai mengambil alih, ia menemukan satu rahasia yang dapat mengubah takdir semua manusia. Kekuatan, kebijaksanaan, dan janji masa depan berpadu dalam aksi spektakuler.',
          rating: '13+',
          director: 'Kenji Sato',
          country: 'Japan',
          language: 'Japanese',
          release: '2025',
          cast: [
            { name: 'Yuki T.', role: 'Mechanic' },
            { name: 'Ren A.', role: 'Pilot' },
            { name: 'Mika H.', role: 'Engineer' },
            { name: 'Jiro N.', role: 'Scientist' }
          ]
        }
      };

      const recommendations = [
        { title: 'Zero Hour', image: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=800&q=80' },
        { title: 'Skyfall', image: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80' },
        { title: 'Silent Bloom', image: 'https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=800&q=80' },
        { title: 'Steel Dawn', image: 'https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=800&q=80' }
      ];

      const params = new URLSearchParams(window.location.search);
      const filmKey = params.get('film') || 'crimson-horizon';
      const movie = movies[filmKey] || movies['crimson-horizon'];

      document.getElementById('hero').style.backgroundImage = `linear-gradient(90deg, rgba(0,0,0,0.82), rgba(0,0,0,0.25), rgba(0,0,0,0.78)), url('${movie.image}')`;
      document.getElementById('movieTag').textContent = movie.tag;
      document.getElementById('movieTitle').textContent = movie.title;
      document.getElementById('movieScore').textContent = movie.score;
      document.getElementById('movieYear').textContent = movie.year;
      document.getElementById('movieGenre').textContent = movie.genre;
      document.getElementById('movieDuration').textContent = movie.duration;
      document.getElementById('movieDescription').textContent = movie.description;
      document.getElementById('synopsis').textContent = movie.synopsis;
      document.getElementById('detailDirector').textContent = movie.director;
      document.getElementById('detailCountry').textContent = movie.country;
      document.getElementById('detailLanguage').textContent = movie.language;
      document.getElementById('detailRelease').textContent = movie.release;
      document.getElementById('detailGenre').textContent = movie.genre;
      document.getElementById('detailDuration').textContent = movie.duration;
      document.getElementById('detailYear').textContent = movie.year;
      document.getElementById('detailRating').textContent = movie.rating;

      const castGrid = document.getElementById('castGrid');
      castGrid.innerHTML = movie.cast.map((person) => `
        <div class="cast-card">
          <div class="avatar">${person.name.charAt(0)}</div>
          <strong>${person.name}</strong>
          <span>${person.role}</span>
        </div>
      `).join('');

      const watchlistToggle = document.querySelector('.watchlist-toggle');
      const WATCHLIST_KEY = 'cinemaverse_watchlist';

      function getWatchlist() {
        try {
          return JSON.parse(localStorage.getItem(WATCHLIST_KEY) || '[]');
        } catch {
          return [];
        }
      }

      function updateWatchlistButton() {
        if (!watchlistToggle) return;
        const exists = getWatchlist().some((item) => item.title === movie.title);
        watchlistToggle.textContent = exists ? '✓ Tersimpan' : '＋ Daftar Saya';
        watchlistToggle.style.background = exists ? 'rgba(70, 211, 105, 0.15)' : 'rgba(255,255,255,0.08)';
        watchlistToggle.style.borderColor = exists ? 'rgba(70, 211, 105, 0.7)' : 'rgba(255,255,255,0.12)';
      }

      watchlistToggle.addEventListener('click', () => {
        const items = getWatchlist();
        const exists = items.some((item) => item.title === movie.title);
        const next = exists
          ? items.filter((item) => item.title !== movie.title)
          : [...items, { title: movie.title, addedAt: new Date().toISOString() }];
        localStorage.setItem(WATCHLIST_KEY, JSON.stringify(next));
        updateWatchlistButton();
      });

      updateWatchlistButton();

      const recWrap = document.getElementById('recommendations');
      recWrap.innerHTML = recommendations.map((item) => `
        <div class="mini-card">
          <img src="${item.image}" alt="${item.title}" />
          <div class="text">${item.title}</div>
        </div>
      `).join('');

      const trailerModal = document.createElement('div');
      trailerModal.id = 'trailerModal';
      trailerModal.style.position = 'fixed';
      trailerModal.style.inset = '0';
      trailerModal.style.background = 'rgba(0,0,0,0.8)';
      trailerModal.style.display = 'none';
      trailerModal.style.alignItems = 'center';
      trailerModal.style.justifyContent = 'center';
      trailerModal.style.zIndex = '999';
      trailerModal.innerHTML = `
        <div style="position:relative; width:min(960px, 92vw); background:#111; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.08); box-shadow:0 20px 80px rgba(0,0,0,0.8);">
          <button id="closeTrailer" style="position:absolute; top:12px; right:12px; width:36px; height:36px; border:none; border-radius:50%; background:rgba(0,0,0,0.7); color:white; font-size:1.5rem; cursor:pointer; z-index:2;">×</button>
          <div style="position:relative; padding-bottom:56.25%; height:0;">
            <iframe
              src="https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=1&mute=1"
              title="Trailer ${movie.title}"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen
              style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
            ></iframe>
          </div>
        </div>
      `;
      document.body.appendChild(trailerModal);

      const trailerOpen = document.getElementById('playTrailerBtn');
      const trailerClose = document.getElementById('closeTrailer');

      trailerOpen.addEventListener('click', () => {
        trailerModal.style.display = 'flex';
      });

      trailerClose.addEventListener('click', () => {
        trailerModal.style.display = 'none';
        const iframe = trailerModal.querySelector('iframe');
        iframe.src = iframe.src;
      });

      trailerModal.addEventListener('click', (event) => {
        if (event.target === trailerModal) {
          trailerModal.style.display = 'none';
          const iframe = trailerModal.querySelector('iframe');
          iframe.src = iframe.src;
        }
      });
    </script>
  </body>
</html>
