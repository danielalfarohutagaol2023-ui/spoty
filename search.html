<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | CineFlix</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --bg-soft: #14141a;
        --white: #f5f5f5;
        --muted: #b9b9c2;
        --line: rgba(255,255,255,0.08);
        --red: #e50914;
        --red-dark: #b20710;
        --panel: rgba(255,255,255,0.03);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: radial-gradient(circle at top, rgba(229,9,20,0.14), transparent 28%), var(--bg);
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      img { display: block; max-width: 100%; }
      button, input { font: inherit; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(11,11,15,0.9);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .container { width: min(1200px, calc(100% - 40px)); margin: 0 auto; }
      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
      }
      .brand {
        color: var(--red);
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .nav {
        display: flex;
        gap: 20px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .nav a:hover { color: var(--white); }

      .page { padding: 30px 0 80px; }
      .search-shell {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 22px;
      }
      .search-box {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      input {
        flex: 1;
        min-width: 220px;
        height: 56px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--white);
        padding: 0 16px;
        outline: none;
      }
      input:focus {
        border-color: rgba(229, 9, 20, 0.7);
        box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
      }
      .search-btn {
        height: 56px;
        padding: 0 24px;
        border: none;
        border-radius: 14px;
        background: var(--red);
        color: var(--white);
        font-weight: 800;
        cursor: pointer;
      }
      .search-btn:hover { background: var(--red-dark); }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 22px;
      }
      .chip {
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--white);
        cursor: pointer;
        font-weight: 700;
      }
      .chip.active,
      .chip:hover {
        background: var(--red);
        border-color: var(--red);
      }

      .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        color: var(--muted);
      }
      .results-header strong { color: var(--white); }

      .results {
        display: grid;
        grid-template-columns: repeat(5, minmax(180px, 1fr));
        gap: 18px;
      }
      .item {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0,0,0,0.28);
      }
      .item img {
        width: 100%;
        height: 230px;
        object-fit: cover;
      }
      .item .body {
        padding: 12px;
      }
      .item h3 { margin: 0 0 6px; font-size: 1rem; }
      .item p { margin: 0; color: var(--muted); font-size: 0.78rem; }
      .empty {
        display: none;
        padding: 32px 0 10px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 980px) {
        .results { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
        .nav { display: none; }
      }
      @media (max-width: 640px) {
        .results { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="index.html" class="brand">CINEFLIX</a>
        <nav class="nav" aria-label="Navigasi utama">
          <a href="index.html">Home</a>
          <a href="series.html">TV Series</a>
          <a href="movies.html">Movies</a>
          <a href="watchlist.html">My List</a>
          <a href="search.html">Search</a>
          <a href="profile.html">Profile</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <div class="search-shell">
          <div class="search-box">
            <input id="searchInput" type="text" value="" placeholder="Search title, genre, actor, director..." />
            <button class="search-btn" id="searchBtn" type="button">Search</button>
          </div>

          <div class="filter-row" aria-label="Search filters">
            <button class="chip active" data-filter="all" type="button">All</button>
            <button class="chip" data-filter="action" type="button">Action</button>
            <button class="chip" data-filter="drama" type="button">Drama</button>
            <button class="chip" data-filter="sci-fi" type="button">Sci‑Fi</button>
            <button class="chip" data-filter="adventure" type="button">Adventure</button>
            <button class="chip" data-filter="thriller" type="button">Thriller</button>
          </div>

          <div class="results-header">
            <span>Search results</span>
            <strong id="resultCount">6 titles</strong>
          </div>

          <section class="results" id="results">
            <article class="item" data-keywords="crimson horizon drama sci fi 2026" data-category="sci-fi">
              <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=80" alt="Crimson Horizon" />
              <div class="body"><h3>Crimson Horizon</h3><p>Drama • 2026</p></div>
            </article>
            <article class="item" data-keywords="midnight run action thriller 2026" data-category="action">
              <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="Midnight Run" />
              <div class="body"><h3>Midnight Run</h3><p>Action • 2026</p></div>
            </article>
            <article class="item" data-keywords="skyfall adventure action 2026" data-category="adventure">
              <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80" alt="Skyfall" />
              <div class="body"><h3>Skyfall</h3><p>Adventure • 2026</p></div>
            </article>
            <article class="item" data-keywords="nowhere city drama urban 2023" data-category="drama">
              <img src="https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?auto=format&fit=crop&w=900&q=80" alt="Nowhere City" />
              <div class="body"><h3>Nowhere City</h3><p>Drama • 2023</p></div>
            </article>
            <article class="item" data-keywords="steel dawn action 2026" data-category="action">
              <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=900&q=80" alt="Steel Dawn" />
              <div class="body"><h3>Steel Dawn</h3><p>Action • 2026</p></div>
            </article>
            <article class="item" data-keywords="silent bloom drama mystery 2025" data-category="thriller">
              <img src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=900&q=80" alt="Silent Bloom" />
              <div class="body"><h3>Silent Bloom</h3><p>Drama • 2025</p></div>
            </article>
          </section>

          <div class="empty" id="emptyState">No title matches your search. Try another keyword.</div>
        </div>
      </div>
    </main>

    <script>
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const chips = document.querySelectorAll('.chip');
      const items = document.querySelectorAll('.item');
      const resultCount = document.getElementById('resultCount');
      const emptyState = document.getElementById('emptyState');
      let activeFilter = 'all';

      function renderResults() {
        const query = searchInput.value.trim().toLowerCase();
        let visible = 0;

        items.forEach((item) => {
          const keywords = item.dataset.keywords.toLowerCase();
          const categoryMatch = activeFilter === 'all' || item.dataset.category === activeFilter;
          const queryMatch = !query || keywords.includes(query);
          const show = categoryMatch && queryMatch;
          item.style.display = show ? 'block' : 'none';
          if (show) visible++;
        });

        resultCount.textContent = visible === 1 ? '1 title' : `${visible} titles`;
        emptyState.style.display = visible ? 'none' : 'block';
      }

      searchBtn.addEventListener('click', renderResults);
      searchInput.addEventListener('input', renderResults);

      chips.forEach((chip) => {
        chip.addEventListener('click', () => {
          chips.forEach((item) => item.classList.toggle('active', item === chip));
          activeFilter = chip.dataset.filter;
          renderResults();
        });
      });

      renderResults();
    </script>
  </body>
</html>
