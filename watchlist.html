<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchlist | CinemaVerse</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --bg-soft: #15151b;
        --white: #f5f5f5;
        --muted: #b9b9c2;
        --line: rgba(255,255,255,0.08);
        --red: #e50914;
        --red-dark: #b20710;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
      }
      a { text-decoration: none; color: inherit; }
      img { display: block; max-width: 100%; }

      .topbar {
        position: sticky;
        top: 0;
        background: rgba(11,11,15,0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .container { width: min(1200px, calc(100% - 40px)); margin: 0 auto; }
      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
      }
      .brand {
        color: var(--red);
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .nav {
        display: flex;
        gap: 20px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .nav a:hover { color: var(--white); }

      .page {
        padding: 28px 0 80px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      .search-box {
        width: min(420px, 100%);
        display: flex;
        align-items: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
      }
      .search-box input {
        flex: 1;
        height: 46px;
        background: transparent;
        border: none;
        color: var(--white);
        padding: 0 16px;
        outline: none;
      }
      .search-box button {
        width: 52px;
        height: 46px;
        border: none;
        background: var(--red);
        color: var(--white);
        font-size: 1.2rem;
        cursor: pointer;
      }

      .watch-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(180px, 1fr));
        gap: 18px;
      }

      .watch-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .watch-item img {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }
      .watch-item .body {
        padding: 12px;
      }
      .watch-item h3 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }
      .watch-item p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .empty {
        display: none;
        text-align: center;
        color: var(--muted);
        padding: 50px 0;
      }

      @media (max-width: 980px) {
        .watch-grid { grid-template-columns: repeat(3, minmax(160px, 1fr)); }
        .nav { display: none; }
      }
      @media (max-width: 640px) {
        .watch-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="index.html" class="brand">NETFLIX</a>
        <nav class="nav" aria-label="Navigasi utama">
          <a href="index.html">Beranda</a>
          <a href="series.html">Series</a>
          <a href="movies.html">Film</a>
          <a href="watchlist.html">Watchlist</a>
          <a href="search.html">Search</a>
          <a href="profile.html">Profil</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <div class="header">
          <h1>Watchlist Saya</h1>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari film favorit..." />
            <button aria-label="Cari">⌕</button>
          </div>
        </div>

        <section class="watch-grid" id="watchGrid"></section>

        <div class="empty" id="emptyState">Watchlist Anda masih kosong. Tambahkan film favorit dari halaman beranda untuk menampilkannya di sini.</div>
      </div>
    </main>

    <script>
      const WATCHLIST_KEY = 'cinemaverse_watchlist';
      const searchInput = document.getElementById('searchInput');
      const watchGrid = document.getElementById('watchGrid');
      const emptyState = document.getElementById('emptyState');

      const posterMap = {
        'Crimson Horizon': 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=80',
        'Midnight Run': 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80',
        'Steel Dawn': 'https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=900&q=80',
        'Silent Bloom': 'https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=900&q=80',
        'Skyfall': 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80',
        'Iron Breaker': 'https://images.unsplash.com/photo-1524989941526-4a35bbd4b2c8?auto=format&fit=crop&w=900&q=80',
        'Nowhere City': 'https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?auto=format&fit=crop&w=900&q=80',
        'Zero Hour': 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=900&q=80'
      };

      function getWatchlist() {
        try {
          const data = JSON.parse(localStorage.getItem(WATCHLIST_KEY) || '[]');
          return Array.isArray(data) ? data : [];
        } catch (error) {
          return [];
        }
      }

      function saveWatchlist(items) {
        localStorage.setItem(WATCHLIST_KEY, JSON.stringify(items));
      }

      function renderWatchlist() {
        const list = getWatchlist();
        const keyword = searchInput.value.trim().toLowerCase();
        const filtered = list.filter((item) => item.title.toLowerCase().includes(keyword));

        if (!filtered.length) {
          emptyState.style.display = 'block';
          watchGrid.innerHTML = '';
          return;
        }

        emptyState.style.display = 'none';
        watchGrid.innerHTML = filtered.map((item) => `
          <article class="watch-item" data-title="${item.title}">
            <img src="${posterMap[item.title] || 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=80'}" alt="${item.title}" />
            <div class="body">
              <h3>${item.title}</h3>
              <p>Watchlist • ${item.addedAt ? new Date(item.addedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Baru'}</p>
              <button class="remove-btn" data-title="${item.title}" type="button" style="margin-top:12px; width:100%; border:none; border-radius:999px; background: rgba(229,9,20,0.12); color:#fff; padding:10px 12px; cursor:pointer; font-weight:700;">Hapus</button>
            </div>
          </article>
        `).join('');

        document.querySelectorAll('.remove-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const titleToRemove = button.dataset.title;
            const remaining = getWatchlist().filter((item) => item.title !== titleToRemove);
            saveWatchlist(remaining);
            renderWatchlist();
          });
        });
      }

      searchInput.addEventListener('input', renderWatchlist);
      renderWatchlist();
    </script>
  </body>
</html>
